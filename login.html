<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXO - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-color: #1B2A1F;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login{
    background-color: #2D3E2F;
    width: 350px;
    padding: 35px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 0 20px rgba(163,197,133,0.35);
}

h1{
    font-family: 'Bebas Neue', sans-serif;
    color: #A3C585;
    font-size: 60px;
    letter-spacing: 8px;
    margin: 0;
}

p{
    color: #F5F5F5;
}

input{
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: none;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

button{
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: #A3C585;
    color: #1B2A1F;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
    font-family: 'Poppins', sans-serif;
}

button:hover{
    background-color: #7FA35F;
}

a{
    text-decoration: none;
    color: #A3C585;
}

a:hover{
    color: #7FA35F;
}

</style>
</head>
<body>

<div class="login">

    <h1>EXO</h1>

    <p>Entre na sua conta</p>

    <form action="home.html">

        <input type="email" placeholder="Digite seu e-mail">

        <input type="password" placeholder="Digite sua senha">

        <button type="submit">ENTRAR</button>

    </form>

    <p><a href="#">Criar Conta</a></p>

</div>

</body>
</html>
